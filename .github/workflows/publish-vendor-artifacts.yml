name: Publish vendor artifacts

# The build is split into two producer jobs and a release job.
#
# `parser` and `rewrite` are separate because most of the work is genuinely
# independent: only rewrite-flix needs the parser jar, while the other seven
# OpenRewrite modules do not, so they build on a second runner instead of
# queueing behind the Flix assembly. Splitting also makes failure attribution
# and re-runs land where the problem is -- a rewrite-side test failure re-runs
# the rewrite job rather than a four-minute Flix build.
#
# They still share one version and one tag. Separate release cadences would be
# the logical end state, but rewrite-flix does not yet pin a published parser
# artifact, so the shared tag is currently the only thing guaranteeing the two
# halves match.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact release version only (for example 2026.07.20.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "version must be YYYY.MM.DD.N, where N starts at 1" >&2
            exit 1
          fi
          echo "tag=vendor-$VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The Flix side: assembly, facade, shrink, shade.
  # ---------------------------------------------------------------------------
  parser:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      flix_commit: ${{ steps.flix.outputs.sha }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Check out tagged Flix source
        uses: actions/checkout@v7
        with:
          repository: wstein/flix-fork
          ref: ${{ needs.validate.outputs.tag }}
          path: flix
          fetch-depth: 1

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Building the Flix assembly is the slowest step in the job, and it is a
      # pure function of the flix commit, so cache it by that commit rather than
      # rebuilding an identical jar on every release. A release that only moves
      # the rewrite side -- or a re-run after a workflow fix -- then skips it.
      - name: Resolve the Flix commit
        id: flix
        run: echo "sha=$(git -C flix rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Keyed on the commit with no restore-keys: a near-miss must MISS. An
      # assembly from a different commit is not a stale cache, it is the wrong
      # artifact, and it would be published as if it were the tagged one.
      # The salt covers inputs the commit does not: bump it if the JDK or the
      # build tool changes.
      - name: Cache the Flix assembly
        id: flix-assembly
        uses: actions/cache@v6
        with:
          path: flix/out/flix/assembly.dest/out.jar
          key: flix-assembly-jdk21-v1-${{ steps.flix.outputs.sha }}

      - name: Build Flix assembly
        if: steps.flix-assembly.outputs.cache-hit != 'true'
        working-directory: flix
        run: ./mill flix.assembly

      # Whether it was built or restored, everything downstream assumes this jar
      # exists and carries the decoupled front-end. Check both here, so a cache
      # that restored partially fails now rather than as a puzzling ProGuard or
      # scalac error later.
      - name: Verify the Flix assembly
        env:
          # Passed through env rather than interpolated into the script body:
          # ${{ }} substitution happens before bash parses anything, which is how
          # workflow expressions turn into script injection.
          CACHE_HIT: ${{ steps.flix-assembly.outputs.cache-hit }}
          FLIX_SHA: ${{ steps.flix.outputs.sha }}
        run: |
          set -euo pipefail
          ASSEMBLY=flix/out/flix/assembly.dest/out.jar
          if [ ! -s "$ASSEMBLY" ]; then
            echo "No Flix assembly at $ASSEMBLY (cache-hit=${CACHE_HIT})." >&2
            exit 1
          fi

          # Lexer.run must not take a Flix instance. Without the decoupling the
          # whole compiler is reachable, nothing shrinks, and the facade -- which
          # calls the three-argument form -- does not compile.
          #
          # javap writes to a file before grep rather than piping into it: under
          # `set -o pipefail`, `grep -q` exits on its first match and the producer
          # dies of SIGPIPE, so the pipeline fails exactly when the pattern IS
          # found -- which would invert this check and let a Flix-coupled assembly
          # through silently.
          unzip -p "$ASSEMBLY" 'ca/uwaterloo/flix/language/phase/Lexer$.class' > "Lexer.class"
          "${JAVA_HOME}/bin/javap" -p "Lexer.class" > lexer-signatures.txt
          if grep -qE 'run\(.*api\.Flix' lexer-signatures.txt; then
            echo "The tagged Flix commit does not carry the Lexer/Parser2 decoupling." >&2
            echo "Tag the flix fork at a commit that does; see the README." >&2
            exit 1
          fi
          echo "assembly ok ($(du -h "$ASSEMBLY" | cut -f1), flix ${FLIX_SHA})"

      # Build the published parser jar: compile the pure-Java facade against the
      # assembly, merge it in, then shrink from the facade as the only root.
      #
      # The facade is what makes the artifact usable. Shading relocates `scala`,
      # which rewrites the Flix front-end's own public signatures -- Lexer.run
      # would take a relocated Map -- so a consumer compiled against the real
      # Scala library dies with NoSuchMethodError, and shading the consumer too
      # is impossible because scalac hardwires scala.Any and refuses to compile
      # against a relocated standard library. With the boundary carrying only
      # Java types, the relocation is invisible and consumers need no Scala.
      #
      # That also means the jar only has to RUN: consumers compile against the
      # Java facade, never against the Scala classes, so pickle signatures need
      # not survive and the artifact can be both aggressively shrunk and shaded.
      - name: Build the parser jar (facade + ProGuard)
        env:
          PROGUARD_VERSION: "7.9.1"
          SCALA_VERSION: "2.13.18"
        run: |
          set -euo pipefail
          ASSEMBLY=flix/out/flix/assembly.dest/out.jar

          # The facade is compiled against the assembly, so it must be built with
          # the same Scala the assembly was. Drift here would fail confusingly
          # deep inside scalac, so check it up front.
          if ! grep -q "def scalaVersion = \"${SCALA_VERSION}\"" flix/build.mill; then
            echo "flix/build.mill does not use Scala ${SCALA_VERSION}; update SCALA_VERSION." >&2
            grep -n "scalaVersion" flix/build.mill >&2
            exit 1
          fi

          mkdir -p scalac
          for artifact in scala-compiler scala-library scala-reflect; do
            curl -fsSL -o "scalac/${artifact}.jar" \
              "https://repo1.maven.org/maven2/org/scala-lang/${artifact}/${SCALA_VERSION}/${artifact}-${SCALA_VERSION}.jar"
          done
          SCALAC_CP="scalac/scala-compiler.jar:scalac/scala-library.jar:scalac/scala-reflect.jar"

          mkdir -p facade-classes
          # Source lists go through argument files rather than unquoted command
          # substitution, so a path containing a space cannot split into two args.
          find facade/src/main \( -name '*.scala' -o -name '*.java' \) > sources.txt
          find facade/src/main/java -name '*.java' > java-sources.txt

          # scalac reads the .java sources for signatures but emits no class files
          # for them, so javac runs afterwards over the same sources.
          # Every JDK tool is invoked through JAVA_HOME rather than PATH: later
          # actions reorder PATH and the image's default JDK is older than the one
          # installed above, which surfaces as confusing class-file-version errors.
          "${JAVA_HOME}/bin/java" -cp "$SCALAC_CP" scala.tools.nsc.Main \
            -classpath "$ASSEMBLY" -d facade-classes "@sources.txt"
          # --release 21 is required: built with the runner's JDK the facade's
          # class files carry that JDK's version and consumers cannot read them.
          "${JAVA_HOME}/bin/javac" --release 21 -nowarn \
            -cp "facade-classes:$ASSEMBLY" -d facade-classes "@java-sources.txt"

          cp "$ASSEMBLY" merged.jar
          (cd facade-classes && "${JAVA_HOME}/bin/jar" uf ../merged.jar .)

          curl -fsSL -o proguard.zip \
            "https://github.com/Guardsquare/proguard/releases/download/v${PROGUARD_VERSION}/proguard-${PROGUARD_VERSION}.zip"
          unzip -q proguard.zip
          "${JAVA_HOME}/bin/java" -Xmx4g -jar "proguard-${PROGUARD_VERSION}/lib/proguard.jar" \
            @flix-facade.pro \
            -injars merged.jar \
            -outjars tools/shade/flix-parser-shrunk.jar \
            -libraryjars "${JAVA_HOME}/jmods/java.base.jmod(!**.jar;!module-info.class)" \
            -dontoptimize

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      # Relocate Scala into a private namespace so the parser can share a
      # classpath with rewrite-scala, which resolves the same
      # org.scala-lang:scala-library coordinate to a different major version.
      #
      # Only Scala moves. The facade package (org.openrewrite.flix.spi) and the
      # Flix classes keep their names, so the published boundary is untouched by
      # the relocation -- which is the whole reason the facade exists.
      - name: Shade Scala (Gradle Shadow)
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gradle -p tools/shade shadowJar -PartifactVersion="${RELEASE_TAG}"

      # A cheap structural check before the jar leaves this job. The real proof
      # is the rewrite job, which builds rewrite-flix against it and runs its
      # full suite -- but that is a different runner, and failing here names the
      # cause directly.
      - name: Verify the parser jar
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          JAR="tools/shade/build/libs/flix-parser-${RELEASE_TAG}.jar"

          # List the entries once and grep the file, rather than piping unzip into
          # grep. Under `set -o pipefail`, `grep -q` exits on its first match and
          # unzip dies of SIGPIPE, so the pipeline reports failure precisely when
          # the pattern IS found -- which inverts both checks below and makes the
          # unshaded-scala one incapable of ever firing.
          unzip -Z1 "$JAR" > entries.txt

          # Scala must be fully relocated; a stray unshaded entry would collide
          # with the consumer's own Scala.
          if grep -qE '^scala/' entries.txt; then
            echo "Shaded jar still contains unshaded scala/**." >&2
            exit 1
          fi
          # ...and the facade must NOT have been relocated, or the entry point moved.
          if ! grep -q '^org/openrewrite/flix/spi/' entries.txt; then
            echo "Shaded jar has no facade; consumers have no entry point." >&2
            exit 1
          fi
          echo "parser jar structurally ok"

      - name: Stage the Flix artifacts
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp flix/out/flix/assembly.dest/out.jar "dist/flix-${RELEASE_TAG}.jar"
          # One parser artifact: shrunk, shaded, and consumable from plain Java.
          # It replaces the earlier trio -- an R8 jar that could not be compiled
          # against, an unshaded copy to work around that, and a
          # signature-preserving API jar for a Scala consumer that no longer
          # exists now that the boundary is Java.
          cp "tools/shade/build/libs/flix-parser-${RELEASE_TAG}.jar" "dist/flix-parser-${RELEASE_TAG}.jar"

      - name: Upload the Flix artifacts
        uses: actions/upload-artifact@v7
        with:
          name: parser
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The Rewrite side. Needs `parser` only because rewrite-flix consumes the jar;
  # the other modules would build without it.
  # ---------------------------------------------------------------------------
  rewrite:
    needs: [validate, parser]
    runs-on: ubuntu-latest
    outputs:
      rewrite_commit: ${{ steps.rewrite.outputs.sha }}
    steps:
      - name: Check out tagged Rewrite source
        uses: actions/checkout@v7
        with:
          repository: wstein/rewrite-fork
          ref: ${{ needs.validate.outputs.tag }}
          path: rewrite
          fetch-depth: 1

      # Checked out for its .flix sources, not to build it: the standard library,
      # examples and compiler tests are ~880 files, and rewrite-flix's round-trip
      # sweep runs over them. That corpus is the strongest evidence the parser jar
      # actually works, and it costs a shallow clone.
      - name: Check out tagged Flix source (corpus)
        uses: actions/checkout@v7
        with:
          repository: wstein/flix-fork
          ref: ${{ needs.validate.outputs.tag }}
          path: flix
          fetch-depth: 1

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve the Rewrite commit
        id: rewrite
        run: echo "sha=$(git -C rewrite rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download the parser jar
        uses: actions/download-artifact@v8
        with:
          name: parser
          path: parser

      # rewrite-flix is excluded from the build unless this jar is present -- the
      # guard in settings.gradle.kts exists precisely so the module can be built
      # against a locally supplied parser. Dropping the freshly built jar here is
      # what makes the tests below exercise the artifact about to be published,
      # rather than something merely similar to it.
      - name: Supply the parser jar to rewrite-flix
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p rewrite/rewrite-flix/libs
          cp "parser/flix-parser-${RELEASE_TAG}.jar" rewrite/rewrite-flix/libs/flix-facade.jar
          echo "supplied $(du -h rewrite/rewrite-flix/libs/flix-facade.jar | cut -f1) parser jar"

      # The real consumability proof: rewrite-flix compiles against the jar and
      # its suite runs, including the round-trip sweep over the whole Flix corpus.
      - name: Test rewrite-flix against the parser jar
        working-directory: rewrite
        run: ./gradlew :rewrite-flix:test "-Dflix.corpus=${GITHUB_WORKSPACE}/flix"

      - name: Publish required Rewrite modules locally
        working-directory: rewrite
        run: >-
          ./gradlew
          :rewrite-core:publishToMavenLocal
          :rewrite-java:publishToMavenLocal
          :rewrite-java-21:publishToMavenLocal
          :rewrite-java-lombok:publishToMavenLocal
          :rewrite-yaml:publishToMavenLocal
          :rewrite-properties:publishToMavenLocal
          :rewrite-xml:publishToMavenLocal
          :rewrite-flix:publishToMavenLocal

      # The bundle contains the org/openrewrite subtree of a Maven local
      # repository. It intentionally does not duplicate third-party dependencies,
      # which the consumer's build tool resolves normally.
      - name: Package the Rewrite bundle
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/m2-repository/org
          cp -R "$HOME/.m2/repository/org/openrewrite" dist/m2-repository/org/
          tar -C dist -czf "dist/rewrite-m2-${RELEASE_TAG}.tar.gz" m2-repository
          rm -rf dist/m2-repository

      - name: Upload the Rewrite bundle
        uses: actions/upload-artifact@v7
        with:
          name: rewrite
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect both sides, record provenance, publish.
  # ---------------------------------------------------------------------------
  release:
    needs: [validate, parser, rewrite]
    runs-on: ubuntu-latest
    steps:
      - name: Download both producers' artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # Flix and the published OpenRewrite modules are JVM artifacts. Build one
      # canonical bundle; platform-labelled copies would imply a false platform
      # dependency and make consumers choose unnecessarily.
      - name: Write the manifest and checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          FLIX_COMMIT: ${{ needs.parser.outputs.flix_commit }}
          REWRITE_COMMIT: ${{ needs.rewrite.outputs.rewrite_commit }}
        run: |
          set -euo pipefail
          cat > "release/manifest-${RELEASE_TAG}.json" <<EOF
          {
            "releaseTag": "${RELEASE_TAG}",
            "buildPlatform": "linux-amd64",
            "flixCommit": "${FLIX_COMMIT}",
            "rewriteCommit": "${REWRITE_COMMIT}",
            "files": {}
          }
          EOF
          (
            cd release
            # `shasum` is available on both GitHub's Linux and Intel macOS
            # images; GNU-only `sha256sum` is not available by default on macOS.
            shasum -a 256 \
              "flix-${RELEASE_TAG}.jar" \
              "flix-parser-${RELEASE_TAG}.jar" \
              "rewrite-m2-${RELEASE_TAG}.tar.gz" > "SHA256SUMS-${RELEASE_TAG}.txt"
          )

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          FLIX_COMMIT: ${{ needs.parser.outputs.flix_commit }}
          REWRITE_COMMIT: ${{ needs.rewrite.outputs.rewrite_commit }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to modify existing release $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Built from wstein/flix-fork@${FLIX_COMMIT} and wstein/rewrite-fork@${REWRITE_COMMIT}."
