name: Publish vendor artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact release version only (for example 2026.07.20.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "version must be YYYY.MM.DD.N, where N starts at 1" >&2
            exit 1
          fi
          echo "tag=vendor-$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Check out tagged Flix source
        uses: actions/checkout@v5
        with:
          repository: wstein/flix-fork
          ref: ${{ needs.validate.outputs.tag }}
          path: flix
          fetch-depth: 1

      - name: Check out tagged Rewrite source
        uses: actions/checkout@v5
        with:
          repository: wstein/rewrite-fork
          ref: ${{ needs.validate.outputs.tag }}
          path: rewrite
          fetch-depth: 1

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Flix assembly
        working-directory: flix
        run: ./mill flix.assembly

      # Shrink the assembly to the decoupled front-end (Lexer + Parser2 + the
      # SyntaxTree/Token API) with R8, seeded by flix-parser.pro. Dead-method
      # elimination drops the Weeder/Resolver/Typer/backend, which the parse
      # path never calls. Requires the flix fork's feature/java2kotlin branch to
      # carry the Flix-decoupling of Lexer.run/Parser2.run.
      - name: Shrink to slim parser jar (R8)
        env:
          R8_VERSION: "9.1.31"
        run: |
          set -euo pipefail
          curl -fsSL -o r8.jar \
            "https://maven.google.com/com/android/tools/r8/${R8_VERSION}/r8-${R8_VERSION}.jar"
          java -cp r8.jar com.android.tools.r8.R8 \
            --classfile \
            --lib "${JAVA_HOME}" \
            --output tools/shade/flix-parser-shrunk.jar \
            --pg-conf flix-parser.pro \
            flix/out/flix/assembly.dest/out.jar

      # Compile-time counterpart to the R8 jar above. R8 removes every Scala
      # pickle signature, so the slim runtime jar cannot be compiled against:
      # scalac reads the Flix classes as plain Java classes and case-class
      # companions fail to resolve. ProGuard retains the signatures under the
      # same keep rules, so it produces the artifact consumers compile against
      # -- 32 MB full assembly -> ~1.6 MB. See flix-parser-api.pro.
      - name: Build compile-time API jar (ProGuard)
        env:
          PROGUARD_VERSION: "7.9.1"
        run: |
          set -euo pipefail
          curl -fsSL -o proguard.zip \
            "https://github.com/Guardsquare/proguard/releases/download/v${PROGUARD_VERSION}/proguard-${PROGUARD_VERSION}.zip"
          unzip -q proguard.zip
          # The output filter keeps class files only. Any stray resource is a
          # hazard: a root `library.properties` alone is enough to make scalac
          # mistake this jar for the Scala library. `scala/**` is excluded so
          # the partial copy cannot shadow the consumer's real scala-library.
          java -Xmx4g -jar "proguard-${PROGUARD_VERSION}/lib/proguard.jar" \
            @flix-parser-api.pro \
            -injars flix/out/flix/assembly.dest/out.jar \
            -outjars 'flix-parser-api.jar(ca/**.class,org/**.class)' \
            -libraryjars "${JAVA_HOME}/jmods/java.base.jmod(!**.jar;!module-info.class)"

      # Guard the three properties the API jar is useless without. Each has
      # already been observed to fail in practice, so none is theoretical.
      - name: Verify the API jar is compilable against
        run: |
          set -euo pipefail
          fail=0

          # 1. Pickle signatures must survive the shrink (this is what R8 loses).
          unzip -p flix-parser-api.jar \
            ca/uwaterloo/flix/language/ast/SyntaxTree.class > SyntaxTree.class
          if ! javap -v SyntaxTree.class | grep -q ScalaSignature; then
            echo "API jar lost ScalaSignature; scalac cannot compile against it." >&2
            fail=1
          fi

          # `unzip -Z1` lists entry names only, with no header or summary rows
          # to parse around.
          unzip -Z1 flix-parser-api.jar > entries.txt

          # 2. No partial scala-library, which breaks scalac's symbol table.
          if grep -qE '^scala/' entries.txt; then
            echo "API jar bundles scala/**; it would shadow the real scala-library." >&2
            fail=1
          fi

          # 3. Class files only -- see the library.properties hazard above.
          if grep -vE '\.class$|/$' entries.txt | grep -q .; then
            echo "API jar contains non-class resources:" >&2
            grep -vE '\.class$|/$' entries.txt >&2
            fail=1
          fi

          exit "$fail"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      # Relocate Scala 2.13 into a private namespace so the parser can coexist
      # with rewrite-scala (Scala 3) on one classpath.
      #
      # KNOWN LIMITATION -- the shaded jar is not consumable from Scala sources.
      # Relocating `scala` rewrites the Flix front-end's own public signatures
      # (Lexer.run and ReadAst.Root take scala.collection.immutable.Map), so a
      # consumer compiled against the unshaded API jar fails at runtime with
      #   NoSuchMethodError: ca.uwaterloo.flix.language.ast.ReadAst$Root.<init>(
      #     scala.collection.immutable.Map, ...AvailableClasses)
      # (reproduced against this jar). It cannot be fixed by shading the
      # consumer's compile classpath too: scalac hardwires scala.Any/scala.Predef
      # and refuses to compile against a relocated standard library.
      #
      # The resolution is to make the artifact's boundary pure Java -- a small
      # Java facade compiled INTO this jar before shading, exposing the CST with
      # Java-typed signatures -- after which the consumer needs no Scala at all.
      # Until then rewrite-flix consumes the UNSHADED R8 output and the shaded
      # jar is published for evaluation only.
      - name: Shade Scala (Gradle Shadow)
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gradle -p tools/shade shadowJar -PartifactVersion="${RELEASE_TAG}"

      - name: Publish required Rewrite modules locally
        working-directory: rewrite
        run: >-
          ./gradlew
          :rewrite-core:publishToMavenLocal
          :rewrite-java:publishToMavenLocal
          :rewrite-java-21:publishToMavenLocal
          :rewrite-java-lombok:publishToMavenLocal
          :rewrite-yaml:publishToMavenLocal
          :rewrite-properties:publishToMavenLocal
          :rewrite-xml:publishToMavenLocal

      # Flix and the published OpenRewrite modules are JVM artifacts. Build
      # one canonical bundle; platform-labelled copies would imply a false
      # platform dependency and make consumers choose unnecessarily.
      - name: Package canonical vendor artifacts
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          FLIX_COMMIT="$(git -C flix rev-parse HEAD)"
          REWRITE_COMMIT="$(git -C rewrite rev-parse HEAD)"
          mkdir -p dist/m2-repository/org
          cp flix/out/flix/assembly.dest/out.jar "dist/flix-${RELEASE_TAG}.jar"
          cp "tools/shade/build/libs/flix-parser-${RELEASE_TAG}.jar" "dist/flix-parser-${RELEASE_TAG}.jar"
          # Unshaded R8 output: what rewrite-flix actually runs against today,
          # for the reason recorded on the shade step above.
          cp tools/shade/flix-parser-shrunk.jar "dist/flix-parser-unshaded-${RELEASE_TAG}.jar"
          cp flix-parser-api.jar "dist/flix-parser-api-${RELEASE_TAG}.jar"
          cp -R "$HOME/.m2/repository/org/openrewrite" dist/m2-repository/org/
          tar -C dist -czf "dist/rewrite-m2-${RELEASE_TAG}.tar.gz" m2-repository
          rm -rf dist/m2-repository
          cat > "dist/manifest-${RELEASE_TAG}.json" <<EOF
          {
            "releaseTag": "${RELEASE_TAG}",
            "buildPlatform": "linux-amd64",
            "flixCommit": "${FLIX_COMMIT}",
            "rewriteCommit": "${REWRITE_COMMIT}",
            "files": {}
          }
          EOF
          (
            cd dist
            # `shasum` is available on both GitHub's Linux and Intel macOS
            # images; GNU-only `sha256sum` is not available by default on
            # macOS.
            shasum -a 256 \
              "flix-${RELEASE_TAG}.jar" \
              "flix-parser-${RELEASE_TAG}.jar" \
              "flix-parser-unshaded-${RELEASE_TAG}.jar" \
              "flix-parser-api-${RELEASE_TAG}.jar" \
              "rewrite-m2-${RELEASE_TAG}.tar.gz" > "SHA256SUMS-${RELEASE_TAG}.txt"
          )

      - name: Upload canonical release files
        uses: actions/upload-artifact@v4
        with:
          name: vendor-release
          path: dist/
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          FLIX_COMMIT="$(jq -r .flixCommit release/manifest-*.json)"
          REWRITE_COMMIT="$(jq -r .rewriteCommit release/manifest-*.json)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to modify existing release $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Built from wstein/flix-fork@$FLIX_COMMIT and wstein/rewrite-fork@$REWRITE_COMMIT on Linux AMD64, Linux ARM64, and Apple Silicon macOS."
