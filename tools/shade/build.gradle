// Relocates Scala in the shrunk Flix parser jar into a private namespace so
// rewrite-flix can share a classpath with rewrite-scala, which resolves the same
// org.scala-lang:scala-library coordinate to a different major version.
//
// Only Scala is relocated. The Flix front-end classes (ca.uwaterloo.flix.*) and
// the facade (org.openrewrite.flix.spi.*) keep their names, so the boundary
// consumers compile against is unaffected -- which is what makes the shaded jar
// usable at all.
plugins {
    id "java"
    id "com.gradleup.shadow" version "9.6.1"
}

repositories { mavenCentral() }

dependencies {
    // The ProGuard output produced earlier in the workflow.
    implementation files("${rootDir}/flix-parser-shrunk.jar")
}

tasks.named("shadowJar") {
    archiveBaseName = "flix-parser"
    archiveClassifier = ""
    archiveVersion = providers.gradleProperty("artifactVersion").getOrElse("dev")
    relocate "scala", "org.openrewrite.flix.shaded.scala"
    // Bundled dependencies bring their own META-INF/maven/**/pom.xml. Left in,
    // any tool that reads embedded Maven metadata -- `mvn install-file` among
    // them -- can mistake this jar for one of them.
    exclude "META-INF/maven/**"
}

// `gradle -p tools/shade shadowJar -PartifactVersion=<tag>`
// -> tools/shade/build/libs/flix-parser-<tag>.jar
